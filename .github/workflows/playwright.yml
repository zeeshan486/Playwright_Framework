name: Playwright Tests
on:
  push:
    branches: [ main, master, sauce_demo ]
  pull_request:
    branches: [ main, master, sauce_demo ]
  # Manual Trigger: Allows you to run this workflow for a specific environment from GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod

jobs:
  test:
    name: Playwright Tests (${{ inputs.environment || 'qa' }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'qa' }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      # Abstracted Execution: We rely on package.json scripts for the actual command.
      # This allows us to change flags (e.g. adding a new project) without editing YAML.
      run: npm run test:ci
      env:
        # GENERIC CONFIGURATION (Reusable for any project)
        # 1. Variables: Set 'BASE_URL' in GitHub > Settings > Secrets and variables > Variables
        BASE_URL: ${{ vars.BASE_URL }} 
        # 2. Secrets: Set these in GitHub > Settings > Secrets and variables > Secrets
        ADMIN_USER: ${{ secrets.ADMIN_USER }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        STANDARD_USER: ${{ secrets.STANDARD_USER }}
        STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
        # 3. Environment: dynamic based on trigger (defaults to 'qa' for Pushes)
        ENV: ${{ inputs.environment || 'qa' }}

    - name: Upload Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
